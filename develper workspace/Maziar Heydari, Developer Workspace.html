<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Maziar Heydari, Backend Developer</title>
<meta name="description" content="Maziar Heydari is a backend developer building reliable systems and thoughtful backends with Django, Laravel and Go.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,300..800&family=Martian+Mono:wdth,wght@75..112,300..600&display=swap" rel="stylesheet">
<style>
/* ------------------------------------------------------------------
   Tokens
   Warm graphite surfaces, off-white text, one accent: label-tape yellow.
------------------------------------------------------------------- */
:root{
  --bg:#141312; --bg-2:#1A1917; --bg-3:#22211E;
  --line:#2A2825; --line-2:#3B3834;
  --text:#ECE9E2; --text-2:#B5B0A5; --text-3:#7F7A70;
  --accent:#F2C230; --accent-ink:#F2C230; --on-accent:#17140A;
  --bad:#E5604D;
  --sans:"Bricolage Grotesque","Helvetica Neue",Arial,system-ui,sans-serif;
  --mono:"Martian Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --side:276px;
  --ease:cubic-bezier(.2,.7,.1,1);
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#EFEDE8; --bg-2:#E7E4DD; --bg-3:#DEDAD1;
  --line:#D5D1C7; --line-2:#B9B4A8;
  --text:#1B1A17; --text-2:#4D4A43; --text-3:#7A766B;
  --accent:#F2C230; --accent-ink:#7A5A00; --on-accent:#17140A;
  --bad:#B63A27;
  color-scheme:light;
}

/* ------------------------------------------------------------------
   Base
------------------------------------------------------------------- */
*,*::before,*::after{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px);-webkit-text-size-adjust:100%;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--text);font:400 16px/1.6 var(--sans);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
h1,h2,h3,p,ul,ol,dl,dd{margin:0;padding:0}
ul,ol{list-style:none}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
::selection{background:var(--accent);color:var(--on-accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.mono{font-family:var(--mono)}
.skip{position:absolute;left:-999px;top:8px;background:var(--accent);color:var(--on-accent);padding:8px 12px;font:12px var(--mono);z-index:100}
.skip:focus{left:8px}
kbd{font:11px/1 var(--mono);border:1px solid var(--line-2);padding:3px 5px;border-radius:2px;color:var(--text-3)}

/* ------------------------------------------------------------------
   Frame: sidebar + stage
------------------------------------------------------------------- */
.app{display:grid;grid-template-columns:var(--side) minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;height:100dvh;border-right:1px solid var(--line);display:flex;flex-direction:column;padding-top:22px;overflow:auto}
.brand{display:flex;align-items:center;gap:12px;padding:0 22px;text-decoration:none}
.brand svg{flex:none}
.brand-n{display:block;font:600 17px/1.1 var(--sans);letter-spacing:-.015em}
.brand-r{display:block;font:300 11px/1.4 var(--mono);color:var(--text-3);margin-top:4px}
.jump{display:flex;align-items:center;justify-content:space-between;margin:24px 22px 18px;padding:9px 11px;border:1px solid var(--line-2);border-radius:2px;font:400 12px var(--mono);color:var(--text-3);transition:border-color .2s,color .2s}
.jump:hover{border-color:var(--text-3);color:var(--text)}
.nav a{display:block;position:relative;padding:11px 22px;text-decoration:none;transition:background .2s}
.nav a::before{content:"";position:absolute;left:0;top:9px;bottom:9px;width:2px;background:var(--accent);transform:scaleY(0);transition:transform .25s var(--ease)}
.nav a:hover,.nav a:focus-visible{background:var(--bg-2)}
.nav a:hover::before,.nav a:focus-visible::before{transform:scaleY(.45)}
.nav a[aria-current="page"]{background:var(--bg-2)}
.nav a[aria-current="page"]::before{transform:scaleY(1)}
.nav-r{display:flex;justify-content:space-between;align-items:baseline;font:400 13px var(--mono);color:var(--text-2);transition:color .2s,transform .25s var(--ease)}
.nav a:hover .nav-r,.nav a[aria-current="page"] .nav-r{color:var(--text)}
.nav a:hover .nav-r{transform:translateX(3px)}
.nav-k{font-size:11px;color:var(--text-3)}
.peek{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s var(--ease)}
.peek>span{overflow:hidden;font:400 13px/1.45 var(--sans);color:var(--text-3)}
.peek>span>span{display:block;padding-top:5px}
.nav a:hover .peek,.nav a:focus-visible .peek,.nav a[aria-current="page"] .peek{grid-template-rows:1fr}
.sys{margin-top:auto;border-top:1px solid var(--line);padding:16px 22px 20px;display:grid;grid-template-columns:64px 1fr;row-gap:7px;font:300 11.5px/1.5 var(--mono)}
.sys dt{color:var(--text-3)}
.sys dd{color:var(--text-2)}
.sys button{color:var(--text-2);border-bottom:1px solid var(--line-2)}
.sys button:hover{color:var(--text);border-color:var(--text-3)}
.dot{display:inline-block;width:7px;height:7px;background:var(--accent);margin-right:8px;vertical-align:1px;animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

.stage{min-width:0;display:flex;flex-direction:column;min-height:100vh}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;height:46px;background:var(--bg);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 clamp(24px,5vw,72px);font:300 12px var(--mono);color:var(--text-3)}
.crumb{display:flex;gap:8px;min-width:0;white-space:nowrap;overflow:hidden}
.crumb span:last-child{color:var(--text)}
.crumb i{font-style:normal;color:var(--line-2)}
.code b{font-weight:500;color:var(--accent-ink)}
main{flex:1;outline:0;padding:60px clamp(24px,5vw,72px) 96px}
.wrap{max-width:1000px;border-left:1px solid var(--line);padding-left:clamp(20px,3.2vw,44px)}
.foot{padding:20px clamp(24px,5vw,72px);border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:16px;font:300 11.5px var(--mono);color:var(--text-3)}

.view.enter{animation:open .42s var(--ease) both}
@keyframes open{from{clip-path:inset(0 100% 0 0);opacity:.2}to{clip-path:inset(0 0 0 0);opacity:1}}

/* ------------------------------------------------------------------
   Page header
------------------------------------------------------------------- */
.ph{margin-bottom:64px}
.ph h1{font:600 clamp(46px,6.4vw,88px)/.92 var(--sans);letter-spacing:-.04em;font-stretch:88%}
.lede{max-width:54ch;margin-top:26px;font-size:clamp(17px,1.6vw,20px);line-height:1.55;color:var(--text-2)}
h2.sec{font:600 22px/1.2 var(--sans);letter-spacing:-.02em;margin-bottom:22px}

/* ------------------------------------------------------------------
   Home
------------------------------------------------------------------- */
.name{display:block;font:600 clamp(58px,12vw,160px)/.85 var(--sans);letter-spacing:-.05em;font-stretch:90%;animation:widen 1.2s var(--ease) both}
.name span{display:block}
@keyframes widen{from{font-stretch:75%;letter-spacing:-.02em}to{font-stretch:90%;letter-spacing:-.05em}}
.role{display:flex;align-items:center;gap:12px;margin-top:30px;font:500 clamp(20px,2.2vw,26px)/1.2 var(--sans);letter-spacing:-.01em}
.role::before{content:"";width:28px;height:3px;background:var(--accent)}
.tag{max-width:30ch;margin-top:12px;font:300 clamp(20px,2.4vw,30px)/1.25 var(--sans);letter-spacing:-.02em;color:var(--text-2)}

.trace{margin-top:76px}
.tr-head{display:flex;justify-content:space-between;padding-bottom:10px;font:300 11.5px var(--mono);color:var(--text-3)}
.tr-head b{font-weight:500;color:var(--accent-ink)}
.tr-row{display:grid;grid-template-columns:112px minmax(0,1fr) 150px;min-height:46px;border-top:1px solid var(--line);text-decoration:none;position:relative;transition:background .2s}
.tr-row:last-child{border-bottom:1px solid var(--line)}
.tr-row:hover,.tr-row:focus-visible{background:var(--bg-2)}
.tr-name{align-self:center;font:400 13px var(--mono);color:var(--text-2);transition:color .2s}
.tr-row:hover .tr-name{color:var(--text)}
.tr-track{position:relative;background:repeating-linear-gradient(to right,transparent 0,transparent calc(25% - 1px),var(--line) calc(25% - 1px),var(--line) 25%)}
.tr-bar{position:absolute;top:50%;left:var(--l);width:var(--w);height:14px;margin-top:-7px;background:color-mix(in srgb,var(--accent) 34%,transparent);border-left:2px solid var(--accent);transform-origin:left center;transition:background .2s;animation:grow .7s var(--ease) both;animation-delay:calc(var(--i) * 80ms + 350ms)}
.tr-row:hover .tr-bar,.tr-row:focus-visible .tr-bar{background:var(--accent)}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.tr-note{align-self:center;text-align:right;font:300 12px var(--mono);color:var(--text-3)}

.focus{margin-top:72px}
.focus ul{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0 32px}
.focus li{border-top:1px solid var(--line-2);padding-top:14px}
.focus .tg{display:block;font:400 12px var(--mono);color:var(--accent-ink);margin-bottom:8px}
.focus p{color:var(--text-2);font-size:15.5px;line-height:1.5}

/* ------------------------------------------------------------------
   About
------------------------------------------------------------------- */
.ops{border-top:1px solid var(--line-2)}
.ops div{display:grid;grid-template-columns:200px minmax(0,1fr);gap:8px 32px;padding:22px 0;border-bottom:1px solid var(--line)}
.ops dt{font:600 21px/1.2 var(--sans);letter-spacing:-.02em}
.ops dd{max-width:58ch;color:var(--text-2)}
.about-end{margin-top:64px;max-width:54ch;color:var(--text-2)}
.about-end p+p{margin-top:16px}

/* ------------------------------------------------------------------
   Projects
------------------------------------------------------------------- */
.mod{position:relative;border-top:1px solid var(--line-2)}
.mod:last-child{border-bottom:1px solid var(--line-2)}
.mod::before{content:"";position:absolute;left:0;top:-1px;height:1px;width:100%;background:var(--accent);transform:scaleX(0);transform-origin:left;transition:transform .45s var(--ease)}
.mod:hover::before,.mod[data-open]::before{transform:scaleX(1)}
.mod[data-open]::before{width:48px}
.mod:hover:not([data-open])::before{width:100%}
.mod-t{font:inherit}
.mod-h{display:flex;width:100%;justify-content:space-between;align-items:center;gap:20px;padding:26px 0;transition:background .25s}
.mod-h:hover{background:var(--bg-2)}
.mod-l{display:block;min-width:0;transition:transform .3s var(--ease)}
.mod-h:hover .mod-l{transform:translateX(8px)}
.mod-path{display:block;font:300 11.5px var(--mono);color:var(--text-3);margin-bottom:6px}
.mod-name{display:block;font:600 clamp(30px,4vw,52px)/1 var(--sans);letter-spacing:-.035em;font-stretch:90%}
.mod-stack{display:block;margin-top:10px;font:300 12.5px var(--mono);color:var(--text-2)}
.mod-r{display:flex;align-items:center;gap:20px;flex:none;font:300 12px var(--mono);color:var(--text-3)}
.mod-st::before{content:"";display:inline-block;width:6px;height:6px;border:1.5px solid var(--text-3);margin-right:8px;vertical-align:0}
.mod-st.live::before,.mod-st.active::before{background:var(--accent);border-color:var(--accent)}
.mod-go{font-size:20px;color:var(--text-3);transition:transform .3s var(--ease),color .2s;display:inline-block}
.mod-h:hover .mod-go{color:var(--accent-ink);transform:translateX(5px)}
.mod[data-open] .mod-go{transform:rotate(90deg);color:var(--accent-ink)}
.mod[data-open] .mod-h:hover .mod-go{transform:rotate(90deg)}
.mod-d{display:grid;grid-template-rows:0fr;visibility:hidden;transition:grid-template-rows .4s var(--ease),visibility 0s .4s}
.mod[data-open] .mod-d{grid-template-rows:1fr;visibility:visible;transition:grid-template-rows .4s var(--ease),visibility 0s}
.mod-d>div{overflow:hidden}
.mod-di{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:40px;padding:6px 0 44px}
.viz{border:1px solid var(--line-2);background:var(--bg-2);padding:14px;align-self:start}
.viz svg{display:block;width:100%;height:auto}
.viz .b{fill:var(--bg-3);stroke:var(--line-2);stroke-width:1}
.viz .bh{fill:var(--bg-3);stroke:var(--accent);stroke-width:1}
.viz .p{fill:var(--bg-3);stroke:none}
.viz .l{fill:none;stroke:var(--line-2);stroke-width:1;stroke-dasharray:3 3}
.viz .ln{fill:none;stroke:var(--line-2);stroke-width:1}
.viz .t{fill:var(--text-2);font:300 10.5px var(--mono)}
.viz .tt{fill:var(--text);font:500 11.5px var(--mono)}
.viz .m{fill:var(--text-3);font:300 10px var(--mono)}
.viz .a{fill:var(--accent)}
.viz .af{fill:var(--accent);opacity:.55}
.viz .ar{fill:var(--text-2);opacity:.7}
.mod-tx p.lead{font-size:18px;line-height:1.5;color:var(--text);max-width:48ch}
.mod-tx h3{font:400 12px var(--mono);color:var(--text-3);margin:28px 0 10px}
.mod-tx ul.dn li{position:relative;padding-left:20px;color:var(--text-2);font-size:15.5px;line-height:1.5;margin-bottom:8px;max-width:52ch}
.mod-tx ul.dn li::before{content:"";position:absolute;left:0;top:.62em;width:7px;height:2px;background:var(--accent)}
.surf li{display:flex;gap:14px;padding:7px 0;border-top:1px solid var(--line);font:300 12.5px var(--mono);color:var(--text-2)}
.surf li:last-child{border-bottom:1px solid var(--line)}
.surf em{font-style:normal;color:var(--accent-ink);min-width:44px}
.src{display:inline-block;margin-top:22px;font:400 13px var(--mono);color:var(--text);text-decoration:none;border-bottom:1px solid var(--accent);padding-bottom:2px;transition:color .2s}
.src:hover{color:var(--accent-ink)}

/* ------------------------------------------------------------------
   Stack
------------------------------------------------------------------- */
.legend{display:flex;flex-wrap:wrap;gap:8px 26px;margin:-28px 0 36px;font:300 12px var(--mono);color:var(--text-3)}
.lv{display:inline-block;width:10px;height:10px;border:1.5px solid var(--accent);margin-right:9px;vertical-align:-1px}
.lv.d{background:var(--accent)}
.lv.r{background:linear-gradient(to right,var(--accent) 50%,transparent 50%)}
.layer{display:grid;grid-template-columns:150px minmax(0,1fr);gap:8px 32px;padding:22px 0 22px 0;border-top:1px solid var(--line);position:relative;transition:background .2s}
.layer:last-child{border-bottom:1px solid var(--line)}
.layer::before{content:"";position:absolute;left:calc(-1 * clamp(20px,3.2vw,44px) - 1px);top:26px;width:9px;height:9px;background:var(--bg);border:1.5px solid var(--line-2);transition:background .2s,border-color .2s}
.layer:hover::before{background:var(--accent);border-color:var(--accent)}
.layer h3{font:400 13px var(--mono);color:var(--text-2);padding-top:4px}
.items{display:flex;flex-wrap:wrap;gap:6px 30px}
.items li{font:500 clamp(19px,2.2vw,26px)/1.3 var(--sans);letter-spacing:-.02em}
.layer-n{grid-column:2;color:var(--text-3);font-size:14.5px;max-width:56ch}

/* ------------------------------------------------------------------
   Learning
------------------------------------------------------------------- */
.sum{display:flex;flex-wrap:wrap;gap:6px 28px;margin:-28px 0 28px;font:300 12px var(--mono);color:var(--text-3)}
.sum b{font-weight:500;color:var(--text)}
.proc{border-top:1px solid var(--line-2)}
.proc:last-child{border-bottom:1px solid var(--line-2)}
.proc-h{display:grid;grid-template-columns:96px minmax(0,1fr) 150px;align-items:center;gap:8px 24px;width:100%;padding:22px 0;transition:background .25s}
.proc-h:hover{background:var(--bg-2)}
.st{font:400 12px var(--mono);color:var(--text-3)}
.st::before{content:"";display:inline-block;width:7px;height:7px;margin-right:9px;border:1.5px solid var(--text-3)}
.st.running{color:var(--text)}
.st.running::before{background:var(--accent);border-color:var(--accent);animation:pulse 2.4s ease-in-out infinite}
.st.sleeping::before{background:linear-gradient(to right,var(--text-3) 50%,transparent 50%)}
.proc-n{display:block;font:600 clamp(21px,2.4vw,28px)/1.15 var(--sans);letter-spacing:-.025em}
.proc-l{display:block;margin-top:4px;color:var(--text-3);font-size:14.5px;max-width:60ch}
.seg{display:flex;gap:3px}
.seg i{flex:1;height:8px;border:1px solid var(--line-2)}
.seg i.done{background:var(--accent);border-color:var(--accent)}
.seg i.now{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 35%,transparent)}
.proc-d{display:grid;grid-template-rows:0fr;visibility:hidden;transition:grid-template-rows .35s var(--ease),visibility 0s .35s}
.proc[data-open] .proc-d{grid-template-rows:1fr;visibility:visible;transition:grid-template-rows .35s var(--ease),visibility 0s}
.proc-d>div{overflow:hidden}
.steps{padding:0 0 28px 120px}
.steps li{display:flex;gap:18px;padding:7px 0;border-top:1px solid var(--line);font-size:15px;color:var(--text-2)}
.steps li span{min-width:44px;font:300 12px var(--mono);color:var(--text-3);padding-top:2px}
.steps li.now{color:var(--text)}
.steps li.now span{color:var(--accent-ink)}
.steps li.done{color:var(--text-3)}

/* ------------------------------------------------------------------
   Lab
------------------------------------------------------------------- */
.bench{border:1px solid var(--line-2);margin-bottom:64px;background:var(--bg-2)}
.bench-h{display:flex;justify-content:space-between;gap:16px;padding:12px 18px;border-bottom:1px solid var(--line-2);font:300 12px var(--mono);color:var(--text-3)}
.bench-h b{font-weight:500;color:var(--text)}
.bench-b{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:0}
.bench-l{padding:22px 18px 24px;border-right:1px solid var(--line-2)}
.bench-r{padding:22px 18px 24px}
.bench h2{font:600 24px/1.2 var(--sans);letter-spacing:-.02em}
.bench p.q{margin-top:8px;color:var(--text-2);font-size:15px;max-width:46ch}
.cells{display:flex;flex-wrap:wrap;gap:4px;margin:26px 0 8px}
.cells i{width:22px;height:30px;border:1px solid var(--line-2);background:linear-gradient(to top,var(--accent) calc(var(--f,0) * 100%),transparent 0)}
.cells i.on{background:var(--accent);border-color:var(--accent)}
.read{font:300 12px var(--mono);color:var(--text-3)}
.read b{font-weight:500;color:var(--text)}
.ctl{display:grid;grid-template-columns:90px 1fr 34px;align-items:center;gap:12px;margin-top:18px;font:300 12px var(--mono);color:var(--text-3)}
.ctl output{color:var(--text);text-align:right}
input[type=range]{width:100%;accent-color:var(--accent);height:20px;background:transparent}
.btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}
.btn{padding:10px 16px;border:1px solid var(--line-2);border-radius:2px;font:400 12.5px var(--mono);color:var(--text);transition:background .2s,border-color .2s,color .2s}
.btn:hover{border-color:var(--text-3);background:var(--bg-3)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.pri:hover{background:var(--accent);filter:brightness(1.08)}
.btn:active{transform:translateY(1px)}
.tally{display:flex;gap:26px;font:300 12px var(--mono);color:var(--text-3);margin-bottom:12px}
.tally b{font-weight:500;color:var(--text)}
.log{font:300 12px var(--mono);min-height:196px}
.log li{display:flex;gap:14px;padding:6px 0;border-top:1px solid var(--line);color:var(--text-2)}
.log li b{font-weight:500;min-width:30px;color:var(--accent-ink)}
.log li.no b{color:var(--bad)}
.log li.empty{color:var(--text-3)}
.exp{display:grid;grid-template-columns:minmax(0,1fr) 120px;gap:6px 24px;padding:22px 0;border-top:1px solid var(--line)}
.exp:last-child{border-bottom:1px solid var(--line)}
.exp h3{font:400 13px var(--mono);color:var(--text-2)}
.exp p{grid-column:1;color:var(--text);font-size:clamp(17px,1.7vw,20px);line-height:1.4;letter-spacing:-.01em;max-width:52ch}
.exp .tgs{grid-column:1;font:300 12px var(--mono);color:var(--text-3)}
.exp .st{grid-column:2;grid-row:1}

/* ------------------------------------------------------------------
   Contact
------------------------------------------------------------------- */
.chan{border-top:1px solid var(--line-2)}
.chan>div{display:grid;grid-template-columns:110px minmax(0,1fr) auto;align-items:center;gap:8px 24px;padding:20px 0;border-bottom:1px solid var(--line)}
.chan dt{font:400 12.5px var(--mono);color:var(--text-3)}
.chan dd{font:500 clamp(18px,2.2vw,26px)/1.3 var(--sans);letter-spacing:-.02em;overflow-wrap:anywhere}

.btn.link{display:inline-block;text-decoration:none}

.nf{padding:24px 0}

/* ------------------------------------------------------------------
   Command bar
------------------------------------------------------------------- */
.cmd{position:fixed;inset:0;z-index:60;background:rgba(10,9,8,.72);display:none;align-items:flex-start;justify-content:center;padding:calc(12vh + env(safe-area-inset-top,0px)) 16px 0}
.cmd.open{display:flex}
.cmd-p{width:100%;max-width:580px;background:var(--bg-2);border:1px solid var(--line-2);border-radius:2px}
.cmd-p input{width:100%;background:transparent;border:0;border-bottom:1px solid var(--line-2);color:var(--text);padding:16px 18px;font:400 14px var(--mono);outline:0}
.cmd-p input::placeholder{color:var(--text-3)}
.cmd-l{max-height:min(46vh,380px);overflow:auto;padding:6px 0}
.cmd-l li{display:flex;justify-content:space-between;gap:16px;padding:10px 18px;cursor:pointer;font:400 13px var(--mono);color:var(--text-2);border-left:2px solid transparent}
.cmd-l li small{font:300 12px var(--mono);color:var(--text-3);text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cmd-l li[aria-selected="true"]{background:var(--bg-3);color:var(--text);border-left-color:var(--accent)}
.cmd-f{display:flex;gap:18px;padding:10px 18px;border-top:1px solid var(--line);font:300 11.5px var(--mono);color:var(--text-3)}

/* ------------------------------------------------------------------
   Mobile: dock + workspace map
------------------------------------------------------------------- */
.dock{display:none}
.map{display:none}

  .map-h{display:flex;justify-content:space-between;align-items:center;font:300 12px var(--mono);color:var(--text-3);margin-bottom:22px}

    { id: "stack", key: "3", bar: [30, 56], note: () => `${LAYERS.length} layers`, peek: () => `${LAYERS.length} layers, in request order` },
    { id: "learning", key: "4", bar: [44, 80], note: () => `${running} running`, peek: () => `${running} running, ${LEARN.length - running} waiting` },
    { id: "lab", key: "5", bar: [62, 92], note: () => `${EXPS.length} experiments`, peek: () => "Experiments and a live rate limiter" },
    { id: "contact", key: "6", bar: [84, 100], note: () => "open", peek: () => "Email, GitHub, a message starter" }
  ];

  /* ----------------------------------------------------------------
     Views
  ----------------------------------------------------------------- */
  const head = (t, l) => `<header class="ph"><h1>${t}</h1><p class="lede">${l}</p></header>`;

  function viewHome() {
    const rows = AREAS.map((a, i) => `
      <a class="tr-row" href="#/${a.id}" style="--i:${i}">
        <span class="tr-name">/${a.id}</span>
        <span class="tr-track"><span class="tr-bar" style="--l:${a.bar[0]}%;--w:${a.bar[1] - a.bar[0]}%"></span></span>
        <span class="tr-note">${esc(a.note())}</span>
      </a>`).join("");
    return `
      <h1 class="name"><span>Maziar</span><span>Heydari</span></h1>
      <p class="role">Backend Developer</p>
      <p class="tag">Building reliable systems and thoughtful backends.</p>

      <section class="trace" aria-label="Workspace index">
        <div class="tr-head"><span>GET /</span><span><b>200</b> six areas open</span></div>
        ${rows}
      </section>

      <section class="focus" aria-labelledby="fh">
        <h2 class="sec" id="fh">Current focus</h2>
        <ul>
          <li><span class="tg">go</span><p>Authentication services in Go: token rotation, middleware and tests that cover the whole lifecycle.</p></li>
          <li><span class="tg">websockets</span><p>Backpressure and fan-out, so one slow client never slows a whole room.</p></li>
          <li><span class="tg">sql</span><p>Reading query plans and choosing indexes from evidence instead of habit.</p></li>
        </ul>
      </section>`;
  }

  function viewAbout() {
    const ops = [
      ["Contracts first", "I write down the shape of an API before the handlers: requests, errors, limits and versioning. In DRF that is the serializer, in Go it is the struct. The contract lives in one place."],
      ["Boring data", "Constraints and schema do the heavy lifting. Migrations stay small and reversible, and indexes are chosen from query plans rather than guesses."],
      ["Plan for failure", "Timeouts, retries and idempotency are part of the design, not a patch after the first outage. A request should fail in a way the caller can understand."],
      ["Small surfaces", "Modules own one thing and expose little. I would rather have clear boundaries inside one deployable than a network between things that change together."],
      ["Readable operations", "Request IDs in logs, honest health checks, and enough Linux to debug a box without guessing. If I can't explain it from the logs, it isn't done."]
    ].map(([t, d]) => `<div><dt>${t}</dt><dd>${d}</dd></div>`).join("");
    return head("About", "I'm a backend developer. I care about the parts of a system that people only notice when they fail: the contracts between components, data that stays consistent, and behavior under load.") + `
      <section aria-labelledby="oh"><h2 class="sec" id="oh">How I work</h2><dl class="ops">${ops}</dl></section>
      <div class="about-end">
        <p>Most of my work is in Python and PHP, with Django, Django REST Framework and Laravel. I build APIs, real-time features over WebSockets, and the data layer underneath them.</p>
        <p>I'm putting more time into Go, Linux networking and architecture, because systems get interesting where those meet. Most of what I learn goes straight into a small project, so the lab is as important as the finished work.</p>
      </div>`;
  }

  function viewProjects(sub) {
    const open = PROJECTS.some(p => p.id === sub) ? sub : PROJECTS[0].id;
    const mods = PROJECTS.map(p => `
      <article class="mod" data-id="${p.id}"${p.id === open ? " data-open" : ""}>
        <h2 class="mod-t"><button class="mod-h" type="button" aria-expanded="${p.id === open}" aria-controls="d-${p.id}">
          <span class="mod-l"><span class="mod-path">~/projects/${p.id}</span><span class="mod-name">${p.name}</span><span class="mod-stack">${p.stack}</span></span>
          <span class="mod-r"><span class="mod-st ${p.status}">${p.status}</span><span class="mod-go" aria-hidden="true">&rarr;</span></span>
        </button></h2>
        <div class="mod-d" id="d-${p.id}" role="region" aria-label="${p.name} details"><div>
          <div class="mod-di">
            <div class="viz" aria-hidden="false">${SVG[p.id]()}</div>
            <div class="mod-tx">
              <p class="lead">${p.lead}</p>
              <h3>design notes</h3>
              <ul class="dn">${p.design.map(d => `<li>${d}</li>`).join("")}</ul>
              <h3>surface</h3>
              <ul class="surf">${p.surface.map(([m, r]) => `<li><em>${m}</em><span>${esc(r)}</span></li>`).join("")}</ul>
              <a class="src" href="${CONFIG.github}/${p.repo}" target="_blank" rel="noopener">View source on GitHub</a>
            </div>
          </div>
        </div></div>
      </article>`).join("");
    return head("Projects", "Each project is a module you can open. Every one has its own diagram, the decisions behind it, and the surface it exposes.") + `<section aria-label="Project modules">${mods}</section>`;
  }

  function viewStack() {
    const layers = LAYERS.map(l => `
      <section class="layer">
        <h3>${l.name}</h3>
        <ul class="items">${l.items.map(([n, lv]) => `<li><span class="lv ${lv === "e" ? "" : lv}" aria-hidden="true"></span>${n}<span class="sr" style="position:absolute;left:-999px"> (${lv === "d" ? "daily" : lv === "r" ? "regular" : "exploring"})</span></li>`).join("")}</ul>
        <p class="layer-n">${l.note}</p>
      </section>`).join("");
    return head("Stack", "Ordered the way a request travels: from the network, through the interface and application, down to the data and the machine underneath.") + `
      <div class="legend" aria-label="Legend"><span><i class="lv d"></i>daily</span><span><i class="lv r"></i>regular</span><span><i class="lv"></i>exploring</span></div>
      ${layers}`;
  }

  function viewLearning() {
    const procs = LEARN.map((l, i) => {
      const segs = l.steps.map(s => `<i class="${s[1]}"></i>`).join("");
      const done = l.steps.filter(s => s[1] === "done").length;
      return `
      <article class="proc"${i === 0 ? " data-open" : ""} data-id="${l.id}">
        <h2><button class="proc-h" type="button" aria-expanded="${i === 0}" aria-controls="p-${l.id}">
          <span class="st ${l.state}">${l.state}</span>
          <span><span class="proc-n">${l.name}</span><span class="proc-l">${l.line}</span></span>
          <span class="seg" role="img" aria-label="${done} of ${l.steps.length} checkpoints done">${segs}</span>
        </button></h2>
        <div class="proc-d" id="p-${l.id}" role="region" aria-label="${l.name} checkpoints"><div>
          <ul class="steps">${l.steps.map(([t, s]) => `<li class="${s}"><span>${s}</span>${t}</li>`).join("")}</ul>
        </div></div>
      </article>`;
    }).join("");
    const q = LEARN.filter(l => l.state === "queued").length, s = LEARN.filter(l => l.state === "sleeping").length;
    return head("Learning", "Learning here is a set of processes with checkpoints, not a wall of badges. Running means I'm working on it now, sleeping means paused, queued means not started.") + `
      <div class="sum"><span><b>${running}</b> running</span><span><b>${s}</b> sleeping</span><span><b>${q}</b> queued</span></div>
      <section class="procs" aria-label="Learning processes">${procs}</section>`;
  }

  function viewLab() {
    const exps = EXPS.map(e => `
      <article class="exp">
        <h3>lab/${e.id}</h3>
        <span class="st ${e.state === "running" ? "running" : "hyp"}">${e.state}</span>
        <p>${e.q}</p>
        <span class="tgs">${e.tags}</span>
      </article>`).join("");
    return head("Lab", "Prototypes and experiments that aren't ready to be projects. Some answer a question, some just teach me where a system bends.") + `
      <section class="bench" aria-labelledby="bh">
        <div class="bench-h"><span><b>lab/token-bucket</b></span><span>live</span></div>
        <div class="bench-b">
          <div class="bench-l">
            <h2 id="bh">Token bucket rate limiter</h2>
            <p class="q">Each request spends a token. Tokens refill at a steady rate up to the bucket size. Send requests and watch when the limiter says no.</p>
            <div class="cells" id="cells" aria-hidden="true"></div>
            <p class="read" id="read" aria-live="off"></p>
            <label class="ctl" for="cap"><span>bucket size</span><input id="cap" type="range" min="2" max="16" value="8"><output id="capO">8</output></label>
            <label class="ctl" for="rate"><span>refill / sec</span><input id="rate" type="range" min="1" max="8" value="2"><output id="rateO">2</output></label>
            <div class="btns"><button class="btn pri" id="send" type="button">Send request</button><button class="btn" id="burst" type="button">Burst of 10</button><button class="btn" id="reset" type="button">Reset</button></div>
          </div>
          <div class="bench-r">
            <div class="tally"><span>allowed <b id="okN">0</b></span><span>limited <b id="noN">0</b></span></div>
            <ul class="log" id="log"><li class="empty">No requests yet.</li></ul>
          </div>
        </div>
      </section>
      <h2 class="sec">Experiments</h2>
      <section aria-label="Experiments">${exps}</section>`;
  }

  function viewContact() {
    return head("Contact", "If you're working on APIs, real-time features or backend architecture, I'd like to hear about it. Email is the fastest way to reach me.") + `
      <dl class="chan">
        <div><dt>email</dt><dd><a href="mailto:${CONFIG.email}">${CONFIG.email}</a></dd><button class="btn" type="button" id="copy">Copy</button></div>
        <div><dt>github</dt><dd><a href="${CONFIG.github}" target="_blank" rel="noopener">${CONFIG.github.replace("https://", "")}</a></dd><span></span></div>
        <div><dt>web</dt><dd>${CONFIG.site}</dd><span></span></div>
      </dl>
      <section class="compose" aria-labelledby="ch">
        <h2 class="sec" id="ch">Start a message</h2>
        <label>your name<input id="cn" type="text" autocomplete="name"></label>
        <label>what are you building<input id="ct" type="text" placeholder="An API for…"></label>
        <label>anything I should know<textarea id="cm"></textarea></label>
        <a class="btn pri link" id="cmail" href="mailto:${CONFIG.email}">Open in mail app</a>
      </section>`;
  }

  function viewNotFound(raw) {
    return `<div class="nf"><h1 class="mod-name" style="font-size:clamp(46px,7vw,92px)">404</h1><p>There is no area called <span class="mono">/${esc(raw)}</span> in this workspace. Pick one from the list, or press <kbd>/</kbd> to search.</p><a class="btn pri link" href="#/">Back to the index</a></div>`;
  }

  /* ----------------------------------------------------------------
     Router
  ----------------------------------------------------------------- */
  const view = $("#view"), main = $("#main");
  let current = null, labTimer = null, firstRender = true;

  function parse() {
    const [area = "", sub = ""] = location.hash.replace(/^#\/?/, "").split("/");
    return { area, sub };
  }

  function setCrumb(parts, code) {
    $("#crumb").innerHTML = ["maziar", ...parts].map((p, i, a) => `${i ? "<i>/</i>" : ""}<span>${esc(p)}</span>`).join("");
    const path = "/" + parts.join("/");
    $("#code").innerHTML = `GET ${esc(path)} <b>${code}</b>`;
    $("#dockPath").textContent = "~" + path + (parts.length ? "" : "");
  }

  function route() {
    const { area, sub } = parse();
    stopLab();
    const def = AREAS.find(a => a.id === area);
    let html, title, parts, code = 200;
    if (!area) { html = viewHome(); title = "Backend Developer"; parts = []; }
    else if (def) {
      parts = [area];
      title = area[0].toUpperCase() + area.slice(1);
      html = { about: viewAbout, projects: () => viewProjects(sub), stack: viewStack, learning: viewLearning, lab: viewLab, contact: viewContact }[area]();
      if (area === "projects") parts = ["projects", PROJECTS.some(p => p.id === sub) ? sub : PROJECTS[0].id];
    } else { html = viewNotFound(area); title = "Not found"; parts = [area]; code = 404; }

    const areaChanged = current !== area;
    current = area;
    view.innerHTML = html;
    if (!reduce) { view.classList.remove("enter"); void view.offsetWidth; view.classList.add("enter"); }
    document.title = (area ? title + " | " : "") + "Maziar Heydari, Backend Developer";
    setCrumb(parts, code);
    $$("#nav a, #mapList a").forEach(a => {
      const on = a.dataset.id === area;
      on ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current");
    });
    const idx = AREAS.findIndex(a => a.id === area);
    $("#dockSeg").innerHTML = AREAS.map((_, i) => `<i class="${i === idx ? "on" : ""}"></i>`).join("");
    if (areaChanged) window.scrollTo(0, 0);
    if (!firstRender) main.focus({ preventScroll: true });
    firstRender = false;
    closeMap();

    if (reduce) $$(".viz animateMotion").forEach(n => n.parentNode.remove());
    bindView(area);
  }

  const go = path => { location.hash = "#/" + path; };

  function bindView(area) {
    if (area === "projects") {
      $$(".mod-h").forEach(b => b.addEventListener("click", () => {
        const mod = b.closest(".mod"), id = mod.dataset.id, was = mod.hasAttribute("data-open");
        $$(".mod").forEach(m => { m.removeAttribute("data-open"); $(".mod-h", m).setAttribute("aria-expanded", "false"); });
        if (!was) { mod.setAttribute("data-open", ""); b.setAttribute("aria-expanded", "true"); }
        history.replaceState(null, "", was ? "#/projects" : "#/projects/" + id);
        setCrumb(was ? ["projects"] : ["projects", id], 200);
      }));
    }
    if (area === "learning") {
      $$(".proc-h").forEach(b => b.addEventListener("click", () => {
        const p = b.closest(".proc"), was = p.hasAttribute("data-open");
        $$(".proc").forEach(x => { x.removeAttribute("data-open"); $(".proc-h", x).setAttribute("aria-expanded", "false"); });
        if (!was) { p.setAttribute("data-open", ""); b.setAttribute("aria-expanded", "true"); }
      }));
    }
    if (area === "lab") startLab();
    if (area === "contact") bindContact();
  }

  /* ----------------------------------------------------------------
     Lab: token bucket
  ----------------------------------------------------------------- */
  function stopLab() { if (labTimer) { clearInterval(labTimer); labTimer = null; } }

  function startLab() {
    const st = { cap: 8, rate: 2, tokens: 8, ok: 0, no: 0, n: 0, log: [] };
    const cells = $("#cells"), read = $("#read"), log = $("#log");
    const draw = () => {
      const fl = Math.floor(st.tokens), fr = st.tokens - fl;
      cells.innerHTML = Array.from({ length: st.cap }, (_, i) => i < fl ? '<i class="on"></i>' : `<i style="--f:${i === fl ? fr.toFixed(2) : 0}"></i>`).join("");
      read.innerHTML = `tokens <b>${st.tokens.toFixed(1)}</b> of ${st.cap}, refilling ${st.rate} per second`;
    };
    const paint = () => {
      $("#okN").textContent = st.ok; $("#noN").textContent = st.no;
      log.innerHTML = st.log.length ? st.log.map(l => `<li class="${l.ok ? "" : "no"}"><b>${l.ok ? 200 : 429}</b><span>req ${l.n}</span><span>${l.msg}</span></li>`).join("") : '<li class="empty">No requests yet.</li>';
    };
    const send = () => {
      st.n++;
      if (st.tokens >= 1) { st.tokens -= 1; st.ok++; st.log.unshift({ ok: true, n: st.n, msg: "allowed" }); }
      else { st.no++; const w = ((1 - st.tokens) / st.rate).toFixed(1); st.log.unshift({ ok: false, n: st.n, msg: `Retry-After ${w}s` }); }
      st.log = st.log.slice(0, 7);
    };
    $("#send").addEventListener("click", () => { send(); draw(); paint(); });
    $("#burst").addEventListener("click", () => { for (let i = 0; i < 10; i++) send(); draw(); paint(); });
    $("#reset").addEventListener("click", () => { Object.assign(st, { tokens: st.cap, ok: 0, no: 0, n: 0, log: [] }); draw(); paint(); });
    $("#cap").addEventListener("input", e => { st.cap = +e.target.value; st.tokens = Math.min(st.tokens, st.cap); $("#capO").textContent = st.cap; draw(); });
    $("#rate").addEventListener("input", e => { st.rate = +e.target.value; $("#rateO").textContent = st.rate; draw(); });
    draw(); paint();
    labTimer = setInterval(() => { if (st.tokens < st.cap) { st.tokens = Math.min(st.cap, st.tokens + st.rate * 0.1); draw(); } }, 100);
  }

  /* ----------------------------------------------------------------
     Contact
  ----------------------------------------------------------------- */
  async function copyEmail(btn) {
    let ok = false;
    try { await navigator.clipboard.writeText(CONFIG.email); ok = true; } catch (e) { /* clipboard may be blocked */ }
    if (btn) { const t = btn.textContent; btn.textContent = ok ? "Copied" : "Press Ctrl C"; setTimeout(() => btn.textContent = t, 1600); }
    return ok;
  }

  function bindContact() {
    const cp = $("#copy"); cp && cp.addEventListener("click", () => copyEmail(cp));
    const upd = () => {
      const n = $("#cn").value.trim(), t = $("#ct").value.trim(), m = $("#cm").value.trim();
      const subject = t ? "Backend work: " + t : "Hello from your portfolio";
      const body = [n ? "Hi Maziar, I'm " + n + "." : "Hi Maziar,", t ? "I'm building: " + t : "", m].filter(Boolean).join("\n\n");
      $("#cmail").href = `mailto:${CONFIG.email}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
    };
    ["#cn", "#ct", "#cm"].forEach(s => $(s).addEventListener("input", upd));
  }

  /* ----------------------------------------------------------------
     Chrome: nav, map, theme, session clock
  ----------------------------------------------------------------- */
  const mac = /Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent);
  $("#jumpKey").textContent = mac ? "\u2318 K" : "Ctrl K";

  $("#nav").innerHTML = AREAS.map(a => `
    <a href="#/${a.id}" data-id="${a.id}">
      <span class="nav-r"><span>/${a.id}</span><span class="nav-k">${a.key}</span></span>
      <span class="peek"><span><span>${esc(a.peek())}</span></span></span>
    </a>`).join("");

  $("#mapList").innerHTML = AREAS.map(a => `
    <a href="#/${a.id}" data-id="${a.id}"><span class="n">${a.id[0].toUpperCase() + a.id.slice(1)}<small>/${a.id}</small></span><span class="d">${esc(a.peek())}</span></a>`).join("");

  const seq = ["", ...AREAS.map(a => a.id)];
  const step = d => { const i = seq.indexOf(current); go(seq[(i + d + seq.length) % seq.length]); };
  $("#prev").addEventListener("click", () => step(-1));
  $("#next").addEventListener("click", () => step(1));

  const map = $("#map");
  let mapFocus = null;
  function openMap() { mapFocus = document.activeElement; map.classList.add("open"); $("#mapClose").focus(); }
  function closeMap() { if (map.classList.contains("open")) { map.classList.remove("open"); mapFocus && mapFocus.focus && mapFocus.focus(); } }
  $("#mapBtn").addEventListener("click", openMap);
  $("#mapClose").addEventListener("click", closeMap);
  $("#mapList").addEventListener("click", e => { if (e.target.closest("a")) { mapFocus = null; map.classList.remove("open"); } });

  function setTheme(t, save) {
    document.documentElement.dataset.theme = t;
    $("#themeBtn").textContent = t; $("#themeBtn2").textContent = t;
    if (save) { try { localStorage.setItem("mh-theme", t); } catch (e) { /* storage may be unavailable */ } }
  }
  const toggleTheme = () => setTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark", true);
  let saved = null; try { saved = localStorage.getItem("mh-theme"); } catch (e) { /* ignore */ }
  setTheme(saved === "light" ? "light" : "dark", false);
  $("#themeBtn").addEventListener("click", toggleTheme);
  $("#themeBtn2").addEventListener("click", toggleTheme);

  const t0 = Date.now();
  const pad = n => String(n).padStart(2, "0");
  setInterval(() => {
    const s = Math.floor((Date.now() - t0) / 1000), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60);
    $("#uptime").textContent = (h ? pad(h) + ":" : "") + pad(m) + ":" + pad(s % 60);
  }, 1000);
  $("#uptime").textContent = "00:00";

  /* ----------------------------------------------------------------
     Command bar
  ----------------------------------------------------------------- */
  const cmd = $("#cmd"), cin = $("#cmdIn"), clist = $("#cmdList");
  let cmdItems = [], cmdSel = 0, cmdReturn = null;

  const commands = () => [
    ...AREAS.map(a => ({ label: "/" + a.id, hint: a.peek(), run: () => go(a.id) })),
    ...PROJECTS.map(p => ({ label: "~/projects/" + p.id, hint: p.stack, run: () => go("projects/" + p.id) })),
    { label: "go home", hint: "index", run: () => go("") },
    { label: "toggle theme", hint: "dark or light", run: toggleTheme },
    { label: "copy email", hint: CONFIG.email, run: () => copyEmail() },
    { label: "open github", hint: CONFIG.github.replace("https://", ""), run: () => window.open(CONFIG.github, "_blank", "noopener") }
  ];

  function renderCmd() {
    const q = cin.value.trim().toLowerCase();
    cmdItems = commands().filter(c => !q || (c.label + " " + c.hint).toLowerCase().includes(q));
    cmdSel = Math.min(cmdSel, Math.max(cmdItems.length - 1, 0));
    clist.innerHTML = cmdItems.length ? cmdItems.map((c, i) => `<li role="option" id="co${i}" data-i="${i}" aria-selected="${i === cmdSel}"><span>${esc(c.label)}</span><small>${esc(c.hint)}</small></li>`).join("") : '<li style="cursor:default">Nothing matches that. Try an area name.</li>';
    cin.setAttribute("aria-activedescendant", cmdItems.length ? "co" + cmdSel : "");
    const sel = $('[aria-selected="true"]', clist); sel && sel.scrollIntoView({ block: "nearest" });
  }
  function openCmd() { cmdReturn = document.activeElement; cmd.classList.add("open"); cin.value = ""; cmdSel = 0; renderCmd(); cin.focus(); }
  function closeCmd() { cmd.classList.remove("open"); cmdReturn && cmdReturn.focus && cmdReturn.focus(); }
  const runCmd = i => { const c = cmdItems[i]; if (!c) return; cmd.classList.remove("open"); cmdReturn = null; c.run(); };

  cin.addEventListener("input", () => { cmdSel = 0; renderCmd(); });
  cin.addEventListener("keydown", e => {
    if (e.key === "ArrowDown") { e.preventDefault(); cmdSel = Math.min(cmdSel + 1, cmdItems.length - 1); renderCmd(); }
    else if (e.key === "ArrowUp") { e.preventDefault(); cmdSel = Math.max(cmdSel - 1, 0); renderCmd(); }
    else if (e.key === "Enter") { e.preventDefault(); runCmd(cmdSel); }
    else if (e.key === "Tab") { e.preventDefault(); }
  });
  clist.addEventListener("click", e => { const li = e.target.closest("li[data-i]"); li && runCmd(+li.dataset.i); });
  clist.addEventListener("mousemove", e => { const li = e.target.closest("li[data-i]"); if (li && +li.dataset.i !== cmdSel) { cmdSel = +li.dataset.i; renderCmd(); } });
  cmd.addEventListener("mousedown", e => { if (e.target === cmd) closeCmd(); });
  $("#jump").addEventListener("click", openCmd);

  document.addEventListener("keydown", e => {
    const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") { e.preventDefault(); cmd.classList.contains("open") ? closeCmd() : openCmd(); return; }
    if (e.key === "Escape") { if (cmd.classList.contains("open")) closeCmd(); else closeMap(); return; }
    if (typing || e.metaKey || e.ctrlKey || e.altKey || cmd.classList.contains("open")) return;
    if (e.key === "/") { e.preventDefault(); openCmd(); return; }
    const a = AREAS.find(x => x.key === e.key);
    if (a) go(a.id);
  });

  window.addEventListener("hashchange", route);
  route();
})();
</script>
</body>
</html>
