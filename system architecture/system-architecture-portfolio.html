<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Maziar Heydari — system map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600&family=Spline+Sans+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root, :root[data-theme="dark"]{
  --bg:#0B0D10; --surface:#111419; --surface2:#171A20;
  --line:#20252D; --line2:#2C333D;
  --text:#F1F3F5; --muted:#9AA1AC; --dim:#6B7480;
  --accent:#6EE7B7;
  --grid:rgba(255,255,255,.028); --grid2:rgba(255,255,255,.05);
  --sans:'Schibsted Grotesk',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'Spline Sans Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#F4F5F3; --surface:#FFFFFF; --surface2:#ECEEEB;
  --line:#DADDD8; --line2:#C3C8C1;
  --text:#14171A; --muted:#4F5660; --dim:#78808A;
  --accent:#0A7A53;
  --grid:rgba(0,0,0,.035); --grid2:rgba(0,0,0,.06);
  color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{height:100%;background:var(--bg);color:var(--text);font:400 15px/1.55 var(--sans);display:grid;grid-template-rows:auto minmax(0,1fr);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* top bar */
.bar{display:flex;align-items:center;gap:28px;height:48px;padding:0 20px;border-bottom:1px solid var(--line)}
.brand{font:500 13px var(--mono);color:var(--text);text-decoration:none;white-space:nowrap}
.bar nav{display:flex;gap:2px;min-width:0}
.bar nav button{position:relative;flex:none;white-space:nowrap;background:none;border:0;padding:6px 10px;font:400 12.5px var(--mono);color:var(--muted)}
.bar nav button:hover{color:var(--text)}
.bar nav button[aria-current="true"]{color:var(--text)}
.bar nav button[aria-current="true"]::after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:1px;background:var(--accent)}
.bar .meta{margin-left:auto;font:400 11.5px var(--mono);color:var(--dim);white-space:nowrap}

/* stage */
.stage{display:grid;grid-template-columns:minmax(0,1fr) clamp(380px,32vw,480px);min-height:0}
.map{position:relative;min-width:0;min-height:0;overflow:hidden;
  background-image:
    linear-gradient(var(--grid2) 1px,transparent 1px),
    linear-gradient(90deg,var(--grid2) 1px,transparent 1px),
    linear-gradient(var(--grid) 1px,transparent 1px),
    linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:200px 200px,200px 200px,40px 40px,40px 40px;
  background-position:-1px -1px}
#svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.cap{position:absolute;bottom:14px;font:400 11px var(--mono);color:var(--dim);pointer-events:none}
.cap.l{left:20px}.cap.r{right:20px}

/* svg: structure */
.zone{font:400 10.5px var(--mono);fill:var(--dim)}
.divider{stroke:var(--line2);stroke-dasharray:2 6;stroke-width:1}

/* svg: edges */
.edge{fill:none;stroke-width:1;transition:opacity .3s,stroke .3s}
.t-core{stroke:var(--line2)}
.t-route{stroke:var(--line2);stroke-dasharray:2 5}
.t-rel{stroke:var(--line2);opacity:.5}
.t-ch,.t-chp{stroke:var(--muted);opacity:.6}
.edge.dim{opacity:.1}
.edge.hide{opacity:0;pointer-events:none}
.edge.on{stroke:var(--accent);opacity:1;stroke-dasharray:3 6;animation:flow 1.2s linear infinite}
@keyframes flow{to{stroke-dashoffset:-18}}
.elabel{font:400 10px var(--mono);fill:var(--accent);opacity:0;text-anchor:middle;paint-order:stroke;stroke:var(--bg);stroke-width:5px;stroke-linejoin:round;transition:opacity .25s;pointer-events:none}
.elabel.on{opacity:1}
.pkt{fill:var(--accent);pointer-events:none}

/* svg: nodes */
.node{cursor:pointer;outline:none;transition:opacity .3s;animation:appear .7s ease backwards;animation-delay:var(--d,0ms)}
@keyframes appear{from{opacity:0}to{opacity:1}}
.nbox{fill:var(--surface);stroke:var(--line2);stroke-width:1;transition:stroke .2s,fill .2s}
.nl{font:500 12.5px var(--mono);fill:var(--text)}
.nm{font:400 9.8px var(--mono);fill:var(--dim);transition:fill .2s}
.k-route .nbox{stroke-dasharray:3 3}
.node:hover .nbox{stroke:var(--muted)}
.node.rel .nbox{stroke:var(--muted)}
.node.sel .nbox{stroke:var(--accent);fill:var(--surface2);stroke-width:1.5}
.node.sel .nm{fill:var(--muted)}
.node:focus-visible .nbox{stroke:var(--accent);stroke-width:2}
.node.dim{opacity:.32}
.node.dim:hover{opacity:.8}
.k-root .nl{font:600 22px var(--sans);letter-spacing:-.01em}
.k-root .role{font:400 12px var(--mono);fill:var(--muted)}
.k-root .nm{font-size:10px}
.beat{fill:var(--accent);animation:beat 3.2s ease-in-out infinite}
@keyframes beat{0%,100%{opacity:.35}50%{opacity:1}}
.g-working{fill:var(--accent)}
.g-active{fill:none;stroke:var(--accent);stroke-width:1.2}
.g-active-in{fill:var(--accent)}
.g-exploring{fill:none;stroke:var(--muted);stroke-width:1.2;stroke-dasharray:1.6 1.6}
.child .inner{transition:opacity .3s,transform .3s}
.child:not(.show){pointer-events:none}
.child:not(.show) .inner{opacity:0;transform:translateY(-6px)}
.child{animation:none}
.k-module .nbox{fill:var(--surface2)}

/* learning overlay */
.lp-path{fill:none;stroke:var(--accent);stroke-width:1.3;stroke-dasharray:5 4;opacity:0;transition:opacity .3s;pointer-events:none}
.lp-badge{opacity:0;transition:opacity .3s;pointer-events:none}
.lp-badge circle{fill:var(--bg);stroke:var(--accent);stroke-width:1}
.lp-badge text{font:500 9.5px var(--mono);fill:var(--accent);text-anchor:middle}
.show.lp-path,.show.lp-badge{opacity:1}

/* inspector */
.inspector{border-left:1px solid var(--line);overflow-y:auto;padding:28px 28px 56px;background:var(--bg);scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
.swap{animation:rise .28s ease both}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.crumb{font:400 11.5px var(--mono);color:var(--dim);margin-bottom:16px;display:flex;flex-wrap:wrap;gap:0 2px}
.crumb button{background:none;border:0;padding:0;color:var(--muted);font:inherit}
.crumb button:hover{color:var(--accent)}
.crumb i{font-style:normal;padding:0 3px}
.title{font:600 30px/1.1 var(--sans);letter-spacing:-.022em;margin-bottom:14px}
.lede{color:var(--text);font-size:16px;line-height:1.5;max-width:46ch;margin-bottom:6px}
p.t{color:var(--muted);max-width:52ch;margin-top:8px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 18px;margin:18px 0 22px;padding:12px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);font:400 12px var(--mono)}
.kv dt{color:var(--dim)}.kv dd{color:var(--text);display:flex;align-items:center;gap:7px}
.sec{margin-top:30px}
.sec h2{font:600 13.5px var(--sans);color:var(--muted);margin-bottom:10px;letter-spacing:0}
.rows{border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:minmax(88px,132px) minmax(0,1fr);gap:14px;align-items:baseline;width:100%;text-align:left;text-decoration:none;background:none;border:0;border-bottom:1px solid var(--line);padding:10px 8px 10px 0;position:relative;color:var(--text)}
.rk{font:400 12.5px var(--mono);color:var(--text);overflow-wrap:anywhere}
.rv{font-size:13.5px;color:var(--muted);line-height:1.45}
.rv small{display:block;font:400 11px var(--mono);color:var(--dim);margin-top:2px}
button.row,a.row{cursor:pointer;transition:background .15s,padding .15s}
button.row:hover,a.row:hover{background:var(--surface);padding-left:10px}
button.row:hover::before,a.row:hover::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--accent)}
button.row:hover .rk,a.row:hover .rk{color:var(--accent)}
.st{display:inline-block;width:10px;height:10px;border-radius:50%;flex:none;border:1px solid var(--muted);vertical-align:-1px}
.st.s-working{background:var(--accent);border-color:var(--accent)}
.st.s-active{background:var(--accent);border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--bg),inset 0 0 0 5px var(--accent);background:var(--bg)}
.st.s-exploring{border-style:dashed}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font:400 11.5px var(--mono);color:var(--muted);margin-top:12px}
.legend span{display:inline-flex;align-items:center;gap:7px}

/* module diagram */
.mod{border:1px solid var(--line2);background:var(--surface)}
.mod-h{display:flex;justify-content:space-between;gap:12px;padding:8px 12px;border-bottom:1px solid var(--line2);font:400 11px var(--mono);color:var(--dim)}
.mod ol{list-style:none;position:relative}
.mod ol::before{content:"";position:absolute;left:15px;top:20px;bottom:20px;width:1px;background:var(--line2)}
.mod li{position:relative;padding:10px 12px 10px 36px;border-bottom:1px solid var(--line)}
.mod li:last-child{border-bottom:0}
.mod li::before{content:"";position:absolute;left:11px;top:17px;width:9px;height:9px;border-radius:50%;background:var(--surface);border:1px solid var(--muted);animation:hit .9s ease both;animation-delay:calc(var(--i)*200ms + 250ms)}
@keyframes hit{0%{background:var(--surface);border-color:var(--muted)}35%{background:var(--accent);border-color:var(--accent)}100%{background:var(--surface);border-color:var(--muted)}}
.mod .ln{display:block;font:500 12.5px var(--mono)}
.mod .ld{display:block;font-size:13px;color:var(--muted)}
.note{font:400 11.5px var(--mono);color:var(--dim);margin-top:8px}
.tech{display:flex;flex-wrap:wrap;font:400 12.5px var(--mono);border:1px solid var(--line);}
.tech span{padding:6px 12px;border-right:1px solid var(--line);margin:-1px 0 0 0}
.tech span:last-child{border-right:0}
.dec{list-style:none;border-top:1px solid var(--line)}
.dec li{padding:12px 0;border-bottom:1px solid var(--line)}
.dec b{display:block;font-weight:600;font-size:14px;margin-bottom:2px}
.dec span{color:var(--muted);font-size:13.5px}

/* learning path */
.lp{list-style:none;position:relative;margin-left:5px;padding-left:24px}
.lp::before{content:"";position:absolute;left:5px;top:14px;bottom:20px;width:1px;background:var(--line2)}
.lp>li{position:relative;padding:4px 0 16px}
.lp>li>.st{position:absolute;left:-24px;top:9px;background:var(--bg)}
.lp>li>.st.s-working{background:var(--accent)}
.lp>li>.st.s-active{background:var(--bg)}
.lp-root{font:400 12px var(--mono);color:var(--dim);margin:0 0 6px 5px}
.lp button.pn{display:flex;align-items:baseline;gap:10px;background:none;border:0;padding:0;text-align:left}
.lp button.pn:hover .nm2{color:var(--accent)}
.nm2{font:500 14px var(--mono)}
.ns{font:400 11px var(--mono);color:var(--dim)}
.lp .what{font-size:13px;color:var(--muted);margin:2px 0 6px}
.leaves{display:flex;flex-wrap:wrap;gap:4px 14px;font:400 11.5px var(--mono);color:var(--dim)}
.leaves span{position:relative;padding-left:14px}
.leaves span::before{content:"";position:absolute;left:0;top:.62em;width:8px;height:1px;background:var(--line2)}

/* mobile tree */
.tree{display:none}
.trow{position:relative;display:flex;align-items:baseline;gap:10px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:13px 0;color:var(--text);font:500 14px var(--mono)}
.trow .tm{margin-left:auto;font:400 11.5px var(--mono);color:var(--dim);text-align:right}
.trow[aria-expanded="true"]{color:var(--accent)}
.trow.root{font:600 20px var(--sans);letter-spacing:-.015em;flex-wrap:wrap}
.trow.root .tm{margin-left:0;flex-basis:100%;font:400 12px var(--mono)}
.tg{margin:20px 0 0 4px;padding-left:18px;border-left:1px solid var(--line2)}
.tgl{font:400 11px var(--mono);color:var(--dim);margin:0 0 2px}
.tg .trow::before{content:"";position:absolute;left:-18px;top:50%;width:12px;height:1px;background:var(--line2)}
.tbody{padding:14px 0 26px;border-bottom:1px solid var(--line)}
.tbody .kv{margin-top:8px}

/* mobile */
@media (max-width:860px){
  body{overflow:hidden}
  .bar{gap:12px;padding:0 12px}
  .bar nav{overflow-x:auto;scrollbar-width:none;flex:1}
  .bar nav::-webkit-scrollbar{display:none}
  .bar .meta{display:none}
  .stage{display:block;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .map,.inspector{display:none}
  .tree{display:block;padding:20px 16px 56px;max-width:640px;margin:0 auto}
  .title{font-size:26px}
  .row{grid-template-columns:minmax(80px,112px) minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>

/* ---------- geometry ---------- */
function clip(n,tx,ty){
  const pad=3, dx=tx-n.x, dy=ty-n.y;
  const k=Math.min(dx?(n.w/2+pad)/Math.abs(dx):1e9, dy?(n.h/2+pad)/Math.abs(dy):1e9);
  return [n.x+dx*k, n.y+dy*k];
}
function geom(e){
  const A=N[e.a], B=N[e.b];
  let cx,cy;
  if(e.ctrl==='down'){cx=A.x;cy=Math.max(A.y+55,B.y);}
  else if(e.ctrl==='up'){cx=A.x;cy=B.y+80;}
  else{
    const mx=(A.x+B.x)/2,my=(A.y+B.y)/2,dx=B.x-A.x,dy=B.y-A.y,len=Math.hypot(dx,dy)||1,bend=e.bend||0;
    cx=mx+(-dy/len)*bend;cy=my+(dx/len)*bend;
  }
  const s=clip(A,cx,cy), t=clip(B,cx,cy);
  const f=v=>v.toFixed(1);
  return {
    d:'M'+f(s[0])+' '+f(s[1])+'Q'+f(cx)+' '+f(cy)+' '+f(t[0])+' '+f(t[1]),
    lx:.25*s[0]+.5*cx+.25*t[0], ly:.25*s[1]+.5*cy+.25*t[1]
  };
}

/* ---------- state & painting ---------- */
let sel='system', hov=null;
const VALID = id => id==='system'||id==='stack'||!!N[id]&&id!=='center';

function visChildren(){
  const s=new Set();
  if(sel==='projects'||P[sel]) Object.keys(P).forEach(k=>s.add(k));
  else Object.keys(P).forEach(k=>{if(P[k].primary===sel) s.add(k);});
  return s;
}
function edgeHidden(e,vis){
  if(e.t==='ch') return !(sel==='projects'||!!P[sel]);
  if(e.t==='chp') return !vis.has(e.a);
  return false;
}
function paint(){
  const vis=visChildren();
  let f=sel;
  if(hov && hov!=='center' && !(P[hov]&&!vis.has(hov))) f=hov;
  const isSys=f==='system', isStack=f==='stack', isLearn=f==='learning';
  const on=new Set(), keep=new Set([sel,f,'center']);

  if(isStack){
    TECH_IDS.forEach(i=>keep.add(i));
    edgeEls.forEach(x=>{if(x.e.t==='core') on.add(x.i);});
  }else if(isLearn){
    LEARN_PATH.forEach(i=>keep.add(i));
  }else if(!isSys){
    edgeEls.forEach(x=>{
      if(edgeHidden(x.e,vis)) return;
      if(x.e.a===f||x.e.b===f){on.add(x.i);keep.add(x.e.a);keep.add(x.e.b);}
    });
    if(f==='projects'||P[f]) vis.forEach(k=>{keep.add(k);keep.add(P[k].primary);});
  }
  if(isSys) Object.keys(N).forEach(k=>keep.add(k));

  edgeEls.forEach(x=>{
    const hide=edgeHidden(x.e,vis), isOn=on.has(x.i)&&!hide;
    x.path.classList.toggle('hide',hide);
    x.path.classList.toggle('on',isOn);
    x.path.classList.toggle('dim',!isSys&&!isOn&&!hide);
    if(x.label) x.label.classList.toggle('on',isOn);
  });
  Object.keys(nodeEls).forEach(id=>{
    const g=nodeEls[id], n=N[id];
    g.classList.toggle('sel',id===sel||(id==='center'&&sel==='system'));
    g.classList.toggle('rel',keep.has(id)&&id!==sel&&!isSys);
    if(n.child){
      const show=vis.has(id);
      g.classList.toggle('show',show);
      g.setAttribute('tabindex',show?'0':'-1');
      g.setAttribute('aria-hidden',show?'false':'true');
    }
    g.classList.toggle('dim',!isSys&&!keep.has(id)&&!(n.child&&!vis.has(id)));
  });
  const showLp = sel==='learning';
  lpPaths.forEach(p=>p.classList.toggle('show',showLp));
  lpBadges.forEach(b=>b.classList.toggle('show',showLp));
}

  const g=(N[id]&&N[id].state)?glyph(N[id].state):'';
  let h='<button class="'+cls+'" data-tree="'+id+'" aria-expanded="'+(open?'true':'false')+'">'+(g?g+' ':'')+'<span>'+label+'</span><span class="tm">'+meta+'</span></button>';
  if(open){INLINE=true;h+='<div class="tbody swap">'+detail(sel)+'</div>';INLINE=false;}
  return h;
}
function renderTree(){
  const open=rowOf(sel), t=$('#tree');
  const hadFocus=document.activeElement&&document.activeElement.getAttribute&&document.activeElement.getAttribute('data-tree');
  let h='';
  TREE.forEach(x=>{
    if(x.row) h+=trowHTML(x.row,open===x.row);
    else h+='<div class="tg"><div class="tgl">'+x.g+'</div>'+x.rows.map(r=>trowHTML(r,open===r)).join('')+'</div>';
  });
  t.innerHTML=h;
  if(hadFocus){const b=$('[data-tree="'+hadFocus+'"]',t);if(b)b.focus({preventScroll:true});}
}

/* ---------- routing ---------- */
function go(id,opts){
  if(!VALID(id)) id='system';
  sel=id; hov=null;
  paint(); renderNav(); renderInspector(); renderTree();
  try{ if(!(opts&&opts.noHash)) history.replaceState(null,'','#/'+id); }catch(e){}
  if(getComputedStyle($('#tree')).display!=='none'){
    const b=$('[data-tree="'+rowOf(id)+'"]');
    if(b&&id!=='system') b.scrollIntoView({block:'start',behavior:reduce?'auto':'smooth'});
    else if(id==='system') $('.stage').scrollTo({top:0,behavior:reduce?'auto':'smooth'});
  }
}
document.addEventListener('click',ev=>{
  const g=ev.target.closest('[data-go]');
  if(g){ev.preventDefault();go(g.getAttribute('data-go'));return;}
  const t=ev.target.closest('[data-tree]');
  if(t){
    const id=t.getAttribute('data-tree');
    if(t.getAttribute('aria-expanded')==='true'&&id!=='system') go('system');
    else go(id);
  }
});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&sel!=='system') go('system');});
window.addEventListener('hashchange',()=>{
  const m=/^#\/([\w-]+)$/.exec(location.hash);
  if(m&&VALID(m[1])&&m[1]!==sel) go(m[1],{noHash:true});
});

/* ---------- ambient motion: requests passing along spokes ---------- */
function packet(){
  if(reduce||document.hidden) return;
  const pool=edgeEls.filter(x=>x.e.t==='core'&&!x.path.classList.contains('dim'));
  if(!pool.length) return;
  const x=pool[Math.floor(Math.random()*pool.length)], p=x.path;
  let len;try{len=p.getTotalLength();}catch(e){return;}
  const c=el('circle',{class:'pkt',r:2.2,cx:-10,cy:-10},gPkt);
  const rev=Math.random()<.5, t0=performance.now(), dur=1600;
  (function step(t){
    const k=Math.min(1,(t-t0)/dur), pt=p.getPointAtLength((rev?1-k:k)*len);
    c.setAttribute('cx',pt.x);c.setAttribute('cy',pt.y);
    c.style.opacity=String(Math.sin(Math.PI*k)*.9);
    if(k<1) requestAnimationFrame(step); else c.remove();
  })(t0);
}
if(!reduce) setInterval(packet,2800);

/* ---------- init ---------- */
$('#meta').textContent='map v2 · '+Object.keys(N).filter(k=>k!=='center').length+' nodes';
const m0=/^#\/([\w-]+)$/.exec(location.hash||'');
go(m0&&VALID(m0[1])?m0[1]:'system',{noHash:true});
})();
</script>
