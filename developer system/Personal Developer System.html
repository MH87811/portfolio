<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Personal Developer System</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap">
<style>
:root{
  /* Layout: a workspace frame (top bar, rail, stage, status bar). Home is a left-to-right dependency map that grows out of the identity; on phones the same data becomes an expandable tree. */
  --bg:#0a0b0d;
  --panel:#0f1013;
  --raise:#15161a;
  --line:#1f2126;
  --line2:#2d3037;
  --fg:#e9e7e1;
  --dim:#a3a5ab;
  --faint:#7b7d84;
  --accent:#8aa4ff;
  --accent-dim:rgba(138,164,255,.12);
  --accent-line:rgba(138,164,255,.5);
  --sans:'Schibsted Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:dark;
}
html{box-sizing:border-box;height:100%}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
p{margin:0}
h1,h2,h3{margin:0;font-weight:600;text-wrap:balance}
ul{list-style:none;margin:0;padding:0}
dl,dd{margin:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono)}
.lbl{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}

/* ---------- frame ---------- */
.shell{height:100%;display:grid;grid-template-columns:212px minmax(0,1fr);grid-template-rows:48px minmax(0,1fr) 30px;grid-template-areas:"top top" "rail stage" "status status"}
.top{grid-area:top;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 18px;border-bottom:1px solid var(--line);background:var(--bg);min-width:0}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:12px;letter-spacing:.18em;flex:none}
.brand svg{width:24px;height:24px;color:var(--fg)}
.crumbs{display:flex;align-items:center;gap:0;font-family:var(--mono);font-size:12px;color:var(--faint);min-width:0;overflow:hidden;white-space:nowrap}
.crumbs a:hover{color:var(--fg)}
.crumbs .cur-seg{color:var(--fg)}
.crumbs i{font-style:normal;padding:0 1px}
.live{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;color:var(--dim);flex:none;letter-spacing:.04em}
.dot{width:6px;height:6px;background:var(--accent);border-radius:50%;position:relative;flex:none}
.dot::after{content:"";position:absolute;inset:-4px;border:1px solid var(--accent);border-radius:50%;opacity:0;animation:ping 3.4s ease-out infinite}
@keyframes ping{0%{transform:scale(.4);opacity:.7}70%,100%{transform:scale(1.3);opacity:0}}

.rail{grid-area:rail;border-right:1px solid var(--line);padding:22px 0 16px;display:flex;flex-direction:column;gap:26px;overflow:auto;background:var(--bg)}
.rail .lbl{padding:0 18px 8px;display:block}
.rlist a{position:relative;display:grid;grid-template-columns:18px 1fr auto;align-items:center;gap:6px;padding:7px 18px;font-family:var(--mono);font-size:13px;color:var(--dim);transition:color .15s,background .15s}
.rlist a .k{font-size:10.5px;color:var(--faint)}
.rlist a .rm{font-size:11px;color:var(--faint)}
.rlist a:hover{color:var(--fg);background:var(--panel)}
.rlist a.on{color:var(--fg);background:var(--panel)}
.rlist a::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--accent);transform:scaleY(0);transition:transform .22s cubic-bezier(.2,.7,.2,1)}
.rlist a.on::before{transform:scaleY(1)}
.proc a{display:grid;grid-template-columns:20px 1fr;gap:8px;align-items:center;padding:5px 18px;font-family:var(--mono);font-size:12px;color:var(--dim)}
.proc a:hover{color:var(--fg)}
.proc small{display:block;font-size:10.5px;color:var(--faint);line-height:1.2}
.rev{margin-top:auto;padding:0 18px;font-family:var(--mono);font-size:10.5px;color:var(--faint);line-height:1.7}

.stage{grid-area:stage;overflow:auto;min-width:0;background:
  linear-gradient(var(--line) 1px,transparent 1px) 0 0/100% 56px,
  var(--bg);background-blend-mode:normal;position:relative}
.stage::before{content:"";position:absolute;inset:0;background:var(--bg);opacity:.965;pointer-events:none}
.stage>*{position:relative}
.status{grid-area:status;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 18px;border-top:1px solid var(--line);font-family:var(--mono);font-size:11px;color:var(--faint);white-space:nowrap;overflow:hidden}
.status b{font-weight:400;color:var(--dim)}
.status span{display:flex;gap:18px}

.view{padding:34px clamp(20px,3.4vw,56px) 64px;animation:enter .32s cubic-bezier(.2,.7,.2,1) both}
@keyframes enter{from{opacity:0;transform:translateX(10px)}to{opacity:1;transform:none}}
.back{display:none}
.eyebrow{font-family:var(--mono);font-size:12px;color:var(--accent);letter-spacing:.04em}
.vhead{display:grid;gap:12px;margin-bottom:38px;max-width:68ch}
.vhead h1{font-size:clamp(2rem,3.6vw,3rem);letter-spacing:-.03em;line-height:1.05}
.vhead .lede{color:var(--dim);font-size:17px}

/* ---------- home map ---------- */
.home{padding-top:26px}
.map{position:relative;display:grid;grid-template-columns:minmax(250px,1.25fr) minmax(112px,.5fr) minmax(138px,.62fr) minmax(176px,.8fr);column-gap:clamp(28px,4.4vw,84px);row-gap:6px;align-items:stretch;padding:8px 0 18px}
.edges{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.edge{fill:none;stroke-width:1;transition:opacity .22s,stroke .22s}
.edge.h{stroke:var(--line2)}
.edge.d{stroke:var(--faint);stroke-width:1;stroke-dasharray:2 4;opacity:.38}
.edge.h.on{stroke:var(--accent)}
.edge.d.on{stroke:var(--accent);opacity:1;stroke-dasharray:5 5;animation:flow 1.1s linear infinite}
.edge.off{opacity:.12}
@keyframes flow{to{stroke-dashoffset:-20}}
.edge.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw .9s cubic-bezier(.4,.1,.2,1) forwards;animation-delay:var(--dl,0s)}
@keyframes draw{to{stroke-dashoffset:0}}
.edge.d.fade{opacity:0;animation:fadein .8s ease forwards;animation-delay:1.5s}
@keyframes fadein{to{opacity:.38}}

.rootcol{grid-column:1;align-self:center;position:relative;padding-right:22px;display:grid;gap:18px;justify-items:start}
.name{display:grid;font-size:clamp(2.7rem,5.4vw,4.6rem);line-height:.9;letter-spacing:-.04em;font-weight:700}
.role{font-family:var(--mono);font-size:13px;letter-spacing:.24em;color:var(--accent)}
.sum{color:var(--dim);max-width:34ch;font-size:15.5px}
.sys{display:grid;gap:0;width:100%;max-width:300px;border-top:1px solid var(--line2)}
.sys>div{display:grid;grid-template-columns:96px 1fr;padding:7px 0;border-bottom:1px solid var(--line);font-family:var(--mono);font-size:12px}
.sys dt{color:var(--faint);letter-spacing:.1em}
.sys dd{color:var(--fg)}
.cur{display:inline-block;transition:opacity .35s,transform .35s}
.cur.swap{opacity:0;transform:translateY(4px)}
.rootlinks{display:flex;gap:18px;font-family:var(--mono);font-size:12.5px}
.rootlinks a{color:var(--fg);border-bottom:1px solid var(--line2);padding-bottom:2px;transition:border-color .15s,color .15s}
.rootlinks a:hover{border-color:var(--accent);color:var(--accent)}
.port{position:absolute;right:0;top:50%;width:7px;height:7px;margin-top:-3.5px;background:var(--bg);border:1px solid var(--accent)}

.node{display:flex;align-items:center;gap:9px;min-width:0;padding:0 11px;background:var(--bg);border:1px solid var(--line2);border-radius:2px;cursor:pointer;text-align:left;transition:border-color .18s,background .18s,opacity .22s,color .18s}
.node:hover{border-color:var(--faint)}
.node .sq{flex:none;width:6px;height:6px;border:1px solid var(--faint);transition:background .18s,border-color .18s}
.node.is-active{border-color:var(--accent);background:var(--accent-dim);color:#fff}
.node.is-active .sq{background:var(--accent);border-color:var(--accent)}
.node.dim{opacity:.26}
.node.tech{font-family:var(--mono);font-size:12.5px;white-space:nowrap}
.node.tech span{overflow:hidden;text-overflow:ellipsis}
.node.dom{flex-direction:column;align-items:flex-start;gap:3px;padding:11px 12px;font-family:var(--mono)}
.node.dom b{font-weight:500;font-size:11.5px;letter-spacing:.16em}
.node.dom small{font-size:11px;color:var(--faint)}
.mods{grid-column:4;display:flex;flex-direction:column;justify-content:space-around;gap:10px}
.node.mod{flex-direction:row;justify-content:space-between;padding:11px 12px;gap:10px}
.node.mod .mt{display:grid;gap:2px;min-width:0}
.node.mod b{font-weight:600;font-size:14px;letter-spacing:.01em}
.node.mod small{font-family:var(--mono);font-size:11px;color:var(--faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.node.mod .sg{flex:none;color:var(--dim)}
.node.mod.is-active .sg{color:var(--accent)}

.inspect{margin-top:14px;border-top:1px solid var(--line2);display:grid;grid-template-columns:minmax(150px,.7fr) minmax(0,1.5fr) minmax(0,1.2fr);gap:26px;padding:16px 0 0;min-height:132px;align-content:start}
.inspect h3{font-size:22px;letter-spacing:-.02em;line-height:1.15;margin-top:8px}
.inspect p{color:var(--dim);font-size:14.5px;max-width:52ch}
.inspect .rel{display:grid;gap:10px;align-content:start}
.inspect .rel div{display:grid;gap:5px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--mono);font-size:11.5px;padding:3px 8px;border:1px solid var(--line2);border-radius:2px;background:transparent;color:var(--dim);cursor:pointer;transition:border-color .15s,color .15s}
.chip:hover{border-color:var(--accent);color:var(--fg)}
span.chip{cursor:default}
span.chip:hover{border-color:var(--line2);color:var(--dim)}
.open{display:inline-block;margin-top:10px;font-family:var(--mono);font-size:12.5px;color:var(--accent);border-bottom:1px solid var(--accent-line);padding-bottom:1px}
.legend{display:flex;gap:20px;margin-top:10px;font-family:var(--mono);font-size:11.5px;color:var(--faint)}
.legend li{display:flex;align-items:center;gap:8px}
.lg{display:inline-block;width:26px;height:0;border-top:1px solid var(--line2)}
.lg.h{border-top-color:var(--faint)}
.lg.d{border-top:1px dashed var(--faint)}

.mtree{display:none}

/* reveal on first boot only */
.boot .reveal{animation:rise .8s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i,0)*110ms + 100ms)}
.boot .bnode{animation:rise .6s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--c,1)*320ms + var(--r,0)*28ms + 400ms)}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---------- status glyphs ---------- */
.sg.active circle:first-child{fill:currentColor}
.glyph{flex:none;color:var(--accent)}
.glyph.queued{color:var(--faint)}
.g-spin{transform-origin:10px 10px;animation:spin 26s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.g-ring{transform-origin:10px 10px;animation:ring 3.4s ease-out infinite}
@keyframes ring{0%{transform:scale(.55);opacity:.9}100%{transform:scale(1.3);opacity:0}}

/* ---------- about ---------- */
.glance{display:grid;border-top:1px solid var(--line2);margin-bottom:46px;max-width:880px}
.glance>div{display:grid;grid-template-columns:120px 1fr auto;gap:18px;align-items:baseline;padding:13px 0;border-bottom:1px solid var(--line)}
.glance dt{font-family:var(--mono);font-size:11.5px;letter-spacing:.14em;color:var(--faint)}
.glance dd{font-size:16.5px}
.glance a{font-family:var(--mono);font-size:12px;color:var(--accent)}
.twocol{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(260px,1fr);gap:clamp(28px,5vw,80px);max-width:1080px}
.prose{display:grid;gap:16px;max-width:60ch;color:var(--dim);font-size:16.5px}
.principles{display:grid;margin-top:34px;border-top:1px solid var(--line2);max-width:60ch}
.principles>div{padding:14px 0;border-bottom:1px solid var(--line);display:grid;gap:3px}
.principles b{font-weight:600;font-size:16px}
.principles span{color:var(--dim);font-size:14.5px}
.kv{border-top:1px solid var(--line2);align-self:start}
.kv>div{display:grid;grid-template-columns:104px 1fr;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-family:var(--mono);font-size:12.5px}
.kv dt{color:var(--faint);letter-spacing:.08em}
.kv dd{color:var(--fg);overflow-wrap:anywhere}

/* ---------- projects ---------- */
.plist{display:grid;max-width:1040px;border-top:1px solid var(--line2)}
.pmod{display:grid;grid-template-columns:minmax(140px,.55fr) minmax(0,2fr);gap:clamp(18px,4vw,56px);padding:26px 0 28px;border-bottom:1px solid var(--line2)}
.pmeta{display:grid;gap:10px;align-content:start;font-family:var(--mono);font-size:12px;color:var(--faint)}
.pmeta .path{color:var(--accent);font-size:12.5px}
.pstatus{display:flex;align-items:center;gap:8px;color:var(--dim)}
.pbody{display:grid;gap:12px;min-width:0}
.pbody h2{font-size:clamp(1.6rem,2.6vw,2.2rem);letter-spacing:-.03em;line-height:1.05}
.pbody .sub{font-family:var(--mono);font-size:12.5px;color:var(--dim);display:flex;gap:12px;flex-wrap:wrap}
.pbody .sub i{font-style:normal;color:var(--faint)}
.pbody p{color:var(--dim);max-width:60ch}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.btn{font-family:var(--mono);font-size:11.5px;letter-spacing:.1em;padding:7px 11px;border:1px solid var(--line2);border-radius:2px;color:var(--fg);background:transparent;cursor:pointer;transition:border-color .15s,background .15s,color .15s;display:inline-block}
.btn:hover{border-color:var(--accent);background:var(--accent-dim)}
.btn.ext::after{content:" ↗";color:var(--faint)}

/* ---------- case study ---------- */
.chead{display:grid;gap:10px;margin-bottom:34px}
.chead h1{font-size:clamp(2.4rem,5.5vw,4.4rem);letter-spacing:-.04em;line-height:.95;font-weight:700}
.cmeta{font-family:var(--mono);font-size:13px;color:var(--dim);display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.cbody{display:grid;grid-template-columns:168px minmax(0,1fr);gap:clamp(24px,4vw,64px);max-width:1040px;align-items:start}
.cidx{position:sticky;top:20px;display:grid;gap:0;border-left:1px solid var(--line2);font-family:var(--mono);font-size:12px}
.cidx button{background:none;border:0;text-align:left;padding:6px 14px;color:var(--faint);cursor:pointer;position:relative;transition:color .15s}
.cidx button:hover{color:var(--fg)}
.cidx button.on{color:var(--fg)}
.cidx button.on::before{content:"";position:absolute;left:-1px;top:0;bottom:0;width:2px;background:var(--accent)}
.csec{padding-bottom:44px;display:grid;gap:16px;scroll-margin-top:20px;min-width:0}
.csec>.lbl{display:flex;gap:10px;align-items:center}
.csec>.lbl::after{content:"";flex:1;border-top:1px solid var(--line)}
.csec p{color:var(--dim);font-size:16.5px;max-width:62ch}
.arch{display:grid;margin-top:4px}
.tier{display:grid;grid-template-columns:116px minmax(0,1fr);gap:16px}
.tier+.tier{margin-top:24px}
.tlabel{font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:var(--faint);padding-top:11px}
.tnodes{display:flex;flex-wrap:wrap;gap:8px;position:relative}
.tier+.tier .tnodes::before{content:"";position:absolute;left:26px;top:-24px;height:24px;border-left:1px solid var(--accent-line)}
.tier+.tier .tnodes::after{content:"";position:absolute;left:22.5px;top:-6px;border:4px solid transparent;border-top:5px solid var(--accent-line);border-bottom:0}
.anode{display:grid;gap:2px;padding:10px 13px;border:1px solid var(--line2);border-radius:2px;min-width:0;background:var(--bg)}
.anode b{font-weight:500;font-size:14px}
.anode span{font-family:var(--mono);font-size:11.5px;color:var(--dim)}
.anode.side{border-style:dashed}
.techlist li,.adr,.chal{display:grid;grid-template-columns:140px minmax(0,1fr);gap:16px;padding:10px 0;border-bottom:1px solid var(--line)}
.techlist{border-top:1px solid var(--line)}
.techlist a,.techlist b{font-family:var(--mono);font-size:13px;font-weight:500;color:var(--fg)}
.techlist a:hover{color:var(--accent)}
.techlist span{color:var(--dim);font-size:14.5px}
.adrs,.chals{display:grid;border-top:1px solid var(--line)}
.adr,.chal{padding:16px 0}
.adr .id,.chal .id{font-family:var(--mono);font-size:12px;color:var(--accent)}
.adr h3,.chal h3{font-size:16.5px;margin-bottom:6px}
.adr p,.chal p{font-size:15px}
.adr .tr{font-family:var(--mono);font-size:12px;color:var(--faint);margin-top:8px;max-width:62ch}
.repo{display:flex;flex-wrap:wrap;align-items:center;gap:12px;font-family:var(--mono);font-size:13px;padding:14px;border:1px solid var(--line2);border-radius:2px;max-width:520px}
.repo span{overflow-wrap:anywhere;flex:1;min-width:0}
.pn{display:grid;grid-template-columns:1fr 1fr;gap:16px;max-width:1040px;margin-top:8px;border-top:1px solid var(--line2);padding-top:18px}
.pn a{display:grid;gap:3px;font-family:var(--mono);font-size:12px;color:var(--faint)}
.pn a b{font-family:var(--sans);font-size:17px;color:var(--fg);font-weight:600;letter-spacing:-.01em}
.pn a:hover b{color:var(--accent)}
.pn a:last-child{text-align:right}

/* ---------- stack ---------- */
.sgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:40px clamp(28px,5vw,72px);max-width:1120px}
.sdom h2{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--mono);font-weight:500;font-size:12px;letter-spacing:.16em;padding-bottom:10px;border-bottom:1px solid var(--line2)}
.sdom h2 small{font-size:11px;color:var(--faint);letter-spacing:.04em}
.sdom .sdesc{font-size:13.5px;color:var(--faint);padding:10px 0 4px}
.srow{display:grid;gap:3px;padding:11px 10px 11px 12px;margin:0 -12px;border-bottom:1px solid var(--line);position:relative;transition:background .15s,opacity .2s}
.srow .hd{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.srow b{font-family:var(--mono);font-weight:500;font-size:14px}
.srow .role{color:var(--dim);font-size:14px}
.srow .dep{font-family:var(--mono);font-size:11.5px;color:var(--faint);display:flex;flex-wrap:wrap;gap:4px 16px}
.srow .dep a{color:var(--dim);border-bottom:1px solid var(--line2)}
.srow .dep a:hover{color:var(--accent);border-color:var(--accent)}
.srow::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--accent);opacity:0;transition:opacity .15s}
.sgrid.focus .srow{opacity:.35}
.sgrid.focus .srow.rel,.sgrid.focus .srow.self{opacity:1}
.srow.self{background:var(--panel)}
.srow.self::before,.srow.rel::before{opacity:1}
.srow.rel::before{opacity:.45}

/* ---------- learning ---------- */
.states{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;border-top:1px solid var(--line2);margin-bottom:34px;max-width:1040px}
.states>div{display:grid;grid-template-columns:20px 1fr;column-gap:10px;padding:12px 14px 12px 0;font-family:var(--mono);font-size:12px}
.states b{font-weight:500;letter-spacing:.1em}
.states small{grid-column:2;color:var(--faint);font-size:11.5px;line-height:1.4;margin-top:2px}
.lgroup{max-width:1040px;margin-bottom:34px}
.lgroup>.lbl{display:block;padding-bottom:10px;border-bottom:1px solid var(--line2)}
.lrow{display:grid;grid-template-columns:20px minmax(150px,.7fr) 110px minmax(0,1.6fr);gap:18px;align-items:center;padding:15px 0;border-bottom:1px solid var(--line)}
.lrow .ln{font-size:18px;font-weight:600;letter-spacing:-.01em}
.lrow .ls{font-family:var(--mono);font-size:12px;letter-spacing:.1em;color:var(--accent)}
.lrow.queued .ls,.lrow.queued .ln{color:var(--faint)}

/* ----- map behavior ----- */
var edges = [], hover = null, pin = null, drewOnce = false;
function initMap(){
  hover = null; pin = null; edges = [];
  var map = $('#map'); if(!map) return;
  var ro = new ResizeObserver(function(){ drawEdges(); });
  ro.observe(map);
  map.addEventListener('mouseover', function(e){ var n = e.target.closest('[data-id]'); if(n){ hover = n.dataset.id; paint(); } });
  map.addEventListener('mouseleave', function(){ hover = null; paint(); });
  map.addEventListener('focusin', function(e){ var n = e.target.closest('[data-id]'); if(n){ hover = n.dataset.id; paint(); } });
  map.addEventListener('focusout', function(){ hover = null; paint(); });
  map.addEventListener('click', function(e){
    var n = e.target.closest('[data-id]');
    if(n){ pin = (pin === n.dataset.id) ? null : n.dataset.id; }
    else if(!e.target.closest('a')){ pin = null; }
    paint();
  });
  $('#inspect').addEventListener('click', function(e){
    var b = e.target.closest('[data-pin]'); if(b){ pin = b.dataset.pin; hover = null; paint(); }
  });
  drawEdges(); paint();
}
function elbow(x1,y1,x2,y2){
  var dy = y2-y1;
  if(Math.abs(dy) < 1) return 'M'+x1+' '+y1+'H'+x2;
  var xm = x1 + (x2-x1)/2, d = dy>0?1:-1, r = Math.min(8, Math.abs(dy)/2, (x2-x1)/2);
  return 'M'+x1+' '+y1+'H'+(xm-r)+'Q'+xm+' '+y1+' '+xm+' '+(y1+d*r)+'V'+(y2-d*r)+'Q'+xm+' '+y2+' '+(xm+r)+' '+y2+'H'+x2;
}
function drawEdges(){
  var map = $('#map'), svg = $('#edges'); if(!map || !svg) return;
  var mr = map.getBoundingClientRect(); if(!mr.width) return;
  var pt = function(el, side){ var r = el.getBoundingClientRect(); return {x:(side==='r'?r.right:r.left)-mr.left, y:r.top+r.height/2-mr.top}; };
  var port = $('#port'), p0 = pt(port,'r');
  p0.x = port.getBoundingClientRect().left + 3.5 - mr.left;
  var first = !drewOnce && $('.home').classList.contains('boot');
  var out = '', list = [];
  var add = function(a,b,cls,d,i){
    list.push({a:a,b:b});
    out += '<path class="edge '+cls+(first?(cls==='h'?' draw':' fade'):'')+'" data-a="'+a+'" data-b="'+b+'" d="'+d+'"'+(first&&cls==='h'?' pathLength="1" style="--dl:'+(0.35+i*0.05)+'s"':'')+'/>';
  };
  var k = 0;
  GRAPH_ORDER.forEach(function(g){
    var dn = $('[data-id="dom:'+g+'"]'); if(!dn) return;
    var a = pt(dn,'l'), ar = pt(dn,'r');
    add('root','dom:'+g,'h',elbow(p0.x,p0.y,a.x,a.y),k++);
    Object.keys(TECH).filter(function(t){return TECH[t].g===g;}).forEach(function(t){
      var tn = $('[data-id="'+t+'"]'); var b = pt(tn,'l');
      add('dom:'+g,t,'h',elbow(ar.x,ar.y,b.x,b.y),k++);
    });
  });
  var mods = PROJ.map(function(p){return {id:'m:'+p.id, t:p.uses};}).concat([{id:'m:learning',t:LEARN_LINKS},{id:'m:lab',t:LAB_LINKS}]);
  mods.forEach(function(m){
    var mn = $('[data-id="'+m.id+'"]'); var b = pt(mn,'l');
    m.t.forEach(function(t){
      if(!TECH[t] || !TECH[t].g) return;
      var tn = $('[data-id="'+t+'"]'); var a = pt(tn,'r');
      var kx = (b.x-a.x)*0.55;
      add(t,m.id,'d','M'+a.x+' '+a.y+'C'+(a.x+kx)+' '+a.y+' '+(b.x-kx)+' '+b.y+' '+b.x+' '+b.y,0);
    });
  });
  svg.setAttribute('viewBox','0 0 '+mr.width+' '+mr.height);
  svg.innerHTML = out; edges = list; drewOnce = true;
  paint();
}
function domOfTech(t){ return 'dom:'+TECH[t].g; }
function related(id){
  var s = {}; s[id] = 1;
  if(id.indexOf('dom:') === 0){ s.root = 1; edges.forEach(function(e){ if(e.a===id) s[e.b] = 1; }); }
  else if(id.indexOf('m:') === 0){ s.root = 1; edges.forEach(function(e){ if(e.b===id){ s[e.a] = 1; s[domOfTech(e.a)] = 1; } }); }
  else { s.root = 1; s[domOfTech(id)] = 1; edges.forEach(function(e){ if(e.a===id && e.b.indexOf('m:')===0) s[e.b] = 1; }); }
  return s;
}
function paint(){
  var map = $('#map'); if(!map) return;
  var act = pin || hover, s = act ? related(act) : null;
  $$('.node', map).forEach(function(n){
    var id = n.dataset.id;
    n.classList.toggle('dim', !!s && !s[id]);
    n.classList.toggle('is-active', id === act);
  });
  $$('.edge', map).forEach(function(e){
    var on = !!s && s[e.dataset.a] && s[e.dataset.b];
    e.classList.toggle('on', !!on);
    e.classList.toggle('off', !!s && !on);
  });
  $('#inspect').innerHTML = inspectHTML(act);
}
function inspectHTML(id){
  if(!id){
    return '<div><span class="lbl">inspector</span><h3>System map</h3></div>' +
      '<div><p>Hover a node to trace what connects to it. Select one to pin it. Components sit on the left, the work that uses them on the right.</p>' +
      '<ul class="legend"><li><i class="lg h"></i>contains</li><li><i class="lg d"></i>used in</li></ul></div>' +
      '<div class="rel"><div><span class="lbl">at a glance</span><p>'+PROJ.length+' projects · '+Object.keys(TECH).length+' components · '+activeLearn().length+' active learning areas</p></div></div>';
  }
  var kind, name, text, rel = '';
  if(id.indexOf('dom:') === 0){
    var g = id.slice(4); kind = 'domain'; name = DOMAINS[g].n; text = DOMAINS[g].r;
    var ids = Object.keys(TECH).filter(function(t){return TECH[t].g===g;});
    rel = '<div><span class="lbl">components</span>'+chips(ids,true)+'</div>';
  } else if(id.indexOf('m:') === 0){
    var mid = id.slice(2), p = projById(mid), uses;
    if(p){
      kind = 'project · '+p.status; name = p.name; text = p.desc; uses = p.uses;
      rel = '<div><span class="lbl">built with</span>'+chips(uses,true)+'</div><a class="open" href="#'+p.id+'">open case study →</a>';
    } else if(mid === 'learning'){
      kind = 'module'; name = '/learning'; text = 'Areas being worked on right now, with the state each one is in.';
      rel = '<div><span class="lbl">touches</span>'+chips(LEARN_LINKS,true)+'</div><a class="open" href="#learning">open learning →</a>';
    } else {
      kind = 'module'; name = '/lab'; text = 'Experiments, prototypes and notes. Published as they are finished.';
      rel = '<div><span class="lbl">touches</span>'+chips(LAB_LINKS,true)+'</div><a class="open" href="#lab">open lab →</a>';
    }
  } else {
    var t = TECH[id]; kind = 'component · '+DOMAINS[t.d].n.toLowerCase(); name = t.n; text = t.r;
    var ui = usedIn(id), req = t.needs, by = Object.keys(TECH).filter(function(k){return TECH[k].needs.indexOf(id)>-1;});
    if(LEARN_LINKS.indexOf(id)>-1) ui = ui.concat([{learn:1}]);
    rel = '<div><span class="lbl">used in</span><span class="chips">' +
      (usedIn(id).map(function(p){return '<button class="chip" data-pin="m:'+p.id+'">'+p.name.toLowerCase()+'</button>';}).join('') +
       (LEARN_LINKS.indexOf(id)>-1?'<button class="chip" data-pin="m:learning">learning</button>':'') +
       (LAB_LINKS.indexOf(id)>-1?'<button class="chip" data-pin="m:lab">lab</button>':'') || '<span class="chip">nothing yet</span>') + '</span></div>';
    if(req.length) rel += '<div><span class="lbl">requires</span>'+chips(req,true)+'</div>';
    if(by.length) rel += '<div><span class="lbl">required by</span>'+chips(by,true)+'</div>';
  }
  return '<div><span class="lbl">'+kind+'</span><h3>'+name+'</h3></div><div><p>'+text+'</p></div><div class="rel">'+rel+'</div>';
}

function viewStack(){
  var total = Object.keys(TECH).length;
  return '<section class="view">' + head('/maziar/stack','Stack','Installed components, grouped by layer. Each one lists what it requires and where it is used. Hover a row to trace its dependencies.') +
  '<div class="sgrid" id="sgrid">' + STACK_ORDER.map(function(d){
    var ids = Object.keys(TECH).filter(function(k){return TECH[k].d===d;});
    return '<section class="sdom"><h2>'+DOMAINS[d].n+'<small>'+pad(ids.length)+'</small></h2><p class="sdesc">'+DOMAINS[d].r+'</p>' +
    ids.map(function(id){
      var t = TECH[id], u = usedIn(id), by = Object.keys(TECH).filter(function(k){return TECH[k].needs.indexOf(id)>-1;});
      var dep = '';
      if(t.needs.length) dep += '<span>requires '+t.needs.map(function(n){return TECH[n].n.toLowerCase();}).join(', ')+'</span>';
      if(u.length) dep += '<span>used in '+u.map(function(p){return '<a href="#'+p.id+'">'+p.id+'</a>';}).join(' ')+'</span>';
      if(!dep) dep = '<span>no dependencies</span>';
      return '<div class="srow" id="s-'+id+'" data-id="'+id+'"><div class="hd"><b>'+t.n+'</b></div><span class="role">'+t.r+'</span><div class="dep">'+dep+'</div></div>';
    }).join('') + '</section>';
  }).join('') + '</div></section>';
}
function initStack(){
  var grid = $('#sgrid'); if(!grid) return;
  var clear = function(){ grid.classList.remove('focus'); $$('.srow',grid).forEach(function(r){ r.classList.remove('self','rel'); }); };
  grid.addEventListener('mouseover', function(e){
    var row = e.target.closest('.srow'); if(!row) return;
    var id = row.dataset.id, rel = {};
    TECH[id].needs.forEach(function(n){ rel[n] = 1; });
    Object.keys(TECH).forEach(function(k){ if(TECH[k].needs.indexOf(id)>-1) rel[k] = 1; });
    grid.classList.add('focus');
    $$('.srow',grid).forEach(function(r){ r.classList.toggle('self', r === row); r.classList.toggle('rel', !!rel[r.dataset.id]); });
  });
  grid.addEventListener('mouseleave', clear);
}

/* ============ GLOBAL EVENTS ============ */
document.addEventListener('click', function(e){
  var c = e.target.closest('[data-copy]');
  if(c){
    var txt = c.dataset.copy, orig = c.textContent;
    var done = function(){ c.textContent = 'COPIED'; setTimeout(function(){ c.textContent = orig; }, 1600); };
    var fallback = function(){
      var ta = document.createElement('textarea'); ta.value = txt; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select();
      try{ document.execCommand('copy'); done(); }catch(err){ c.textContent = 'SELECT TEXT'; }
      document.body.removeChild(ta);
    };
    try{ navigator.clipboard.writeText(txt).then(done, fallback); }catch(err){ fallback(); }
    return;
  }
  var t = e.target.closest('.tbtn');
  if(t){ var li = t.parentNode, open = li.classList.toggle('open'); t.setAttribute('aria-expanded', open ? 'true' : 'false'); }
  var f = e.target.closest('[data-focus]');
  if(f){ var id = f.dataset.focus; setTimeout(function(){ var r = document.getElementById('s-'+id); if(r){ r.scrollIntoView({block:'center'}); } }, 80); }
});
document.addEventListener('keydown', function(e){
  if(e.metaKey || e.ctrlKey || e.altKey) return;
  var tg = e.target && e.target.tagName; if(tg === 'INPUT' || tg === 'TEXTAREA') return;
  if(/^[0-6]$/.test(e.key)){ location.hash = NAV[+e.key][0]; }
  else if(e.key === 'Escape'){
    var r = route();
    if(r.v === 'project') location.hash = 'projects'; else if(r.v !== 'home') location.hash = 'home';
    else if(pin){ pin = null; paint(); }
  }
});

}
